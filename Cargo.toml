[workspace]
resolver = "2"
members = ["core/inspect-core", "core/policy-core", "core/kravyxctl", "core/ffi"]

[workspace.package]
edition = "2021"
rust-version = "1.80"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = { version = "1.10", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
unicode-normalization = "0.1"
base64 = "0.22"
sha2 = "0.10"
thiserror = "1"
time = { version = "=0.3.36", features = ["parsing", "formatting", "macros"] }

[profile.release]
lto = true
codegen-units = 1
# unwind (not abort): kravyx-ffi catches panics so a malformed input can never
# take down a Go service process. See ADR-006.
panic = "unwind"
strip = true
