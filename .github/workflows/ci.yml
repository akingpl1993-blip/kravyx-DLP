name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.80
        with: { components: "rustfmt, clippy" }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release -p kravyxctl --locked
      - name: Detector pack self-test and bundle validation
        run: |
          ./target/release/kravyxctl detectors
          ./target/release/kravyxctl validate tests/fixtures/bundle-example.json
      - name: No raw sensitive values in simulator output
        run: |
          set +e
          ./target/release/kravyxctl simulate tests/fixtures/bundle-example.json tests/fixtures/context-genai.json tests/corpus/positive/card-export-12.csv > sim.json
          test $? -eq 3   # 3 = blocked
          set -e
          for v in $(cut -d, -f3 tests/corpus/positive/card-export-12.csv | tail -n +2); do
            if grep -q "$v" sim.json; then echo "raw card number leaked: $v"; exit 1; fi
          done

  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.80
      - uses: actions/setup-go@v5
        with: { go-version: "1.23.x" }
      - run: cargo build --release --locked -p kravyx-ffi
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.3 ./...
      - name: OpenAPI contract is valid
        run: pip install openapi-spec-validator==0.7.1 && python3 -c "from openapi_spec_validator import validate; from openapi_spec_validator.readers import read_from_filename as r; validate(r('packages/openapi/policy-service.v1.yaml')[0])"
      - name: Production profiles refuse to start without an authenticator
        run: |
          go build -o kravyx-policy ./services/policy/cmd/kravyx-policy
          if KRAVYX_PROFILE=saas KRAVYX_TLS_CERT_FILE=c KRAVYX_TLS_KEY_FILE=k ./kravyx-policy; then exit 1; fi

  image:
    runs-on: ubuntu-24.04
    needs: [go]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/docker/policy.Dockerfile -t kravyx-policy:ci .
      - uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: "kravyx-policy:ci", severity: "HIGH,CRITICAL", exit-code: "1", ignore-unfixed: true }

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.80
      - run: cargo install cargo-audit --locked --version 0.21.0
      - run: cargo audit

  schemas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pip install jsonschema==4.23.0
      - run: python3 tests/schemas/validate.py

  isolation:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci-only-not-a-secret }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPASSWORD: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - name: Create roles
        run: |
          psql -U postgres -c "CREATE ROLE dlp_owner LOGIN NOSUPERUSER PASSWORD 'ci-only-not-a-secret'"
          psql -U postgres -c "CREATE ROLE dlp_app LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'ci-only-not-a-secret'"
          psql -U postgres -c "CREATE DATABASE dlp OWNER dlp_owner"
      - run: tests/isolation/run.sh

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: No credential-shaped literals in any commit (mirrors GitHub push protection)
        run: python3 tests/secrets/scan.py --history
      - uses: gitleaks/gitleaks-action@v2
        env: { GITLEAKS_CONFIG: .gitleaks.toml }

  semgrep:
    runs-on: ubuntu-24.04
    container: { image: semgrep/semgrep }
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/rust --config p/golang --config p/sql-injection --error
